name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

      # `dist/` is the action's runtime entrypoint: it is what customers
      # actually execute, and it is committed rather than built on their
      # runner. If it drifts from `src/`, a fix can look merged while every
      # customer keeps running the old bundle. Rebuild and require no diff.
      - name: dist/ is in sync with src/
        run: |
          npm run build
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
